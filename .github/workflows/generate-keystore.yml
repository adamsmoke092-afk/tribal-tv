name: Generate signing keystore

# One-time setup for release signing: generates the Tribal TV signing
# keystore and prints its base64 for pasting into the repo secret
# TRIBAL_TV_KEYSTORE_B64 (Settings -> Secrets and variables -> Actions).
# Run it manually from the Actions tab, copy the summary's base64 block
# into that secret, and the release job in build.yml takes over from
# there. A one-day artifact backup of the .jks is uploaded in case the
# copy gets lost — save it somewhere safe.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore tribal-tv.jks \
            -alias tribaltv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tribaltv-release-2026 \
            -keypass tribaltv-release-2026 \
            -dname "CN=Tribal TV, O=Tribal TV, C=ZA"

      - name: Print base64 for the repo secret
        run: |
          {
            echo '### Tribal TV signing keystore'
            echo ''
            echo 'Copy the single line below into the repository secret'
            echo '**TRIBAL_TV_KEYSTORE_B64** (Settings -> Secrets and variables -> Actions -> New repository secret).'
            echo ''
            echo '```'
            base64 -w 0 tribal-tv.jks
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore backup (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-signing-keystore
          path: tribal-tv.jks
          retention-days: 1
