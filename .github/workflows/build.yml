name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is committed (the dev device can't produce the
      # binary wrapper jar), so install Gradle directly. Cache is disabled
      # because there are no wrapper files for the cache probe to key on —
      # the same gotcha that broke the first Neon Dash workflow.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
