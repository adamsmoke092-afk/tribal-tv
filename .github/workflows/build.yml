name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tracked design doc is a leak no later commit can undo. The .gitignore
      # patterns stop a plain `git add -A`; this catches `git add -f`. It prints
      # a count and never a filename -- one of those filenames contains the
      # upstream's name, and this log is public.
      - name: No private design docs tracked
        run: |
          n=$(git ls-files | grep -ciE '(^|/)(BACKEND_[^/]*\.md|BFF_[^/]*\.md)$' || true)
          n=${n:-0}
          if [ "$n" -gt 0 ]; then
            echo "::error::$n private design doc(s) are tracked. Remove them from the index before pushing."
            exit 1
          fi
          echo "no private design docs tracked"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is committed (the dev device can't produce the
      # binary wrapper jar), so install Gradle directly. Cache is disabled
      # because there are no wrapper files for the cache probe to key on —
      # the same gotcha that broke the first Neon Dash workflow.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      # Debug builds are signed with the release key when it exists, so the
      # APK installed on the phone carries the certificate registered in the
      # Google OAuth client. Without it AGP mints a fresh debug keystore on
      # every clean runner and Google Sign-In fails with DEVELOPER_ERROR.
      # The path is exported only when the secret is non-empty, so a fork PR
      # (no secrets) still gets a normally-signed debug APK.
      - name: Decode keystore (if present)
        env:
          KEYSTORE_B64: ${{ secrets.TRIBAL_TV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRIBAL_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIBAL_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRIBAL_TV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No TRIBAL_TV_KEYSTORE_B64 secret; debug APK uses AGP's default debug key."
            exit 0
          fi
          # A half-configured keystore is worse than none: the build would
          # succeed, sign with AGP's throwaway key, and Google Sign-In would
          # fail at runtime with DEVELOPER_ERROR.
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing TRIBAL_TV_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing TRIBAL_TV_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing TRIBAL_TV_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::TRIBAL_TV_KEYSTORE_B64 is set but these are not:$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/tribal-tv.jks"
          # A truncated paste is the failure mode for a 3 KB secret entered by
          # hand. openssl fails loudly on a corrupt file or a wrong password,
          # which turns "the APK is signed with nothing" into a clear message.
          openssl pkcs12 -in "$GITHUB_WORKSPACE/tribal-tv.jks" -noout \
            -passin env:KEYSTORE_PASSWORD
          echo "TRIBAL_TV_KEYSTORE_FILE=$GITHUB_WORKSPACE/tribal-tv.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TRIBAL_TV_KEYSTORE_PASSWORD: ${{ secrets.TRIBAL_TV_KEYSTORE_PASSWORD }}
          TRIBAL_TV_KEY_ALIAS: ${{ secrets.TRIBAL_TV_KEY_ALIAS }}
          TRIBAL_TV_KEY_PASSWORD: ${{ secrets.TRIBAL_TV_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      # The APK must carry the certificate registered in the Google OAuth
      # client, or Google Sign-In fails at runtime with DEVELOPER_ERROR and
      # nothing in the build says so. Skipped when there is no keystore secret
      # (fork PR), because then the APK is not release-signed at all.
      - name: Verify signing certificate
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/tribal-tv.jks" ]; then
            echo "No keystore secret; skipping certificate check."
            exit 0
          fi
          bash scripts/verify-apk-signing.sh \
            app/build/outputs/apk/debug/app-debug.apk \
            63cb1cef21ec6a158c9331cd50f17c133734c7c3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Release signing runs only once the keystore secret exists. The gate
  # job turns secret presence into a job-level condition (secrets can't
  # be read directly in a job's `if`).
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - name: Check for signing secret
        id: check
        env:
          KEYSTORE_B64: ${{ secrets.TRIBAL_TV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.has_keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.TRIBAL_TV_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRIBAL_TV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRIBAL_TV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRIBAL_TV_KEY_PASSWORD }}
        run: |
          # The gate only proves the keystore exists. Without this check a
          # missing password secret would make the build succeed and upload an
          # UNSIGNED apk under the release artifact name.
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing TRIBAL_TV_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing TRIBAL_TV_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing TRIBAL_TV_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::TRIBAL_TV_KEYSTORE_B64 is set but these are not:$missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/tribal-tv.jks"
          # A truncated paste is the failure mode for a 3 KB secret entered by
          # hand. openssl fails loudly on a corrupt file or a wrong password,
          # which turns "the APK is signed with nothing" into a clear message.
          openssl pkcs12 -in "$GITHUB_WORKSPACE/tribal-tv.jks" -noout \
            -passin env:KEYSTORE_PASSWORD

      - name: Build release APK
        env:
          TRIBAL_TV_KEYSTORE_FILE: ${{ github.workspace }}/tribal-tv.jks
          TRIBAL_TV_KEYSTORE_PASSWORD: ${{ secrets.TRIBAL_TV_KEYSTORE_PASSWORD }}
          TRIBAL_TV_KEY_ALIAS: ${{ secrets.TRIBAL_TV_KEY_ALIAS }}
          TRIBAL_TV_KEY_PASSWORD: ${{ secrets.TRIBAL_TV_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signing certificate
        run: |
          bash scripts/verify-apk-signing.sh \
            app/build/outputs/apk/release/app-release.apk \
            63cb1cef21ec6a158c9331cd50f17c133734c7c3

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
