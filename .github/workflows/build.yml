name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No Gradle wrapper is committed (the dev device can't produce the
      # binary wrapper jar), so install Gradle directly. Cache is disabled
      # because there are no wrapper files for the cache probe to key on —
      # the same gotcha that broke the first Neon Dash workflow.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Release signing runs only once the keystore secret exists. The gate
  # job turns secret presence into a job-level condition (secrets can't
  # be read directly in a job's `if`).
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_keystore: ${{ steps.check.outputs.has_keystore }}
    steps:
      - name: Check for signing secret
        id: check
        env:
          KEYSTORE_B64: ${{ secrets.TRIBAL_TV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.has_keystore == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.TRIBAL_TV_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/tribal-tv.jks"

      - name: Build release APK
        env:
          TRIBAL_TV_KEYSTORE_FILE: ${{ github.workspace }}/tribal-tv.jks
          TRIBAL_TV_KEYSTORE_PASSWORD: tribaltv-release-2026
          TRIBAL_TV_KEY_ALIAS: tribaltv
          TRIBAL_TV_KEY_PASSWORD: tribaltv-release-2026
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tribal-tv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
